services:
  - type: web
    name: hri-autotrader
    runtime: python
    pythonVersion: 3.11
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    staticPublishPath: ./frontend
